name: build-and-push-gemini

on:
  push:
    branches: [gemini]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Server-Tests (inkl. PostgreSQL Dev Services)
        run: mvn -f server/pom.xml -B clean verify

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/leon345/Trainingsapp
          tags: |
            ghcr.io/leon345/trainingsapp/server:${{ github.sha }}
            ghcr.io/leon345/trainingsapp/server:gemini

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm --prefix client ci
      - run: npm --prefix client run typecheck
      - run: npm --prefix client run lint
      - run: npm --prefix client test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/leon345/Trainingsapp
          tags: |
            ghcr.io/leon345/trainingsapp/client:${{ github.sha }}
            ghcr.io/leon345/trainingsapp/client:gemini

  helm-chart:
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm-Chart pruefen
        run: |
          helm lint chart --set server.secret.existingSecret=trainingsapp-secrets
          helm template trainingsapp chart --set server.secret.existingSecret=trainingsapp-secrets > /dev/null

      - name: Chart als OCI pushen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package chart --app-version ${{ github.sha }}
          helm push trainingsapp-*.tgz oci://ghcr.io/leon345/charts
