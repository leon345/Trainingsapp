{{- if not .Values.server.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trainingsapp.secretName" . }}
  labels:
    app.kubernetes.io/name: trainingsapp-server
    app.kubernetes.io/component: server
    {{- include "trainingsapp.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ required "server.secret.dbUrl oder server.secret.existingSecret muss gesetzt sein" .Values.server.secret.dbUrl | quote }}
  DB_USER: {{ required "server.secret.dbUser oder server.secret.existingSecret muss gesetzt sein" .Values.server.secret.dbUser | quote }}
  DB_PASSWORD: {{ required "server.secret.dbPassword oder server.secret.existingSecret muss gesetzt sein" .Values.server.secret.dbPassword | quote }}
  SESSION_ENCRYPTION_KEY: {{ required "server.secret.sessionEncryptionKey oder server.secret.existingSecret muss gesetzt sein" .Values.server.secret.sessionEncryptionKey | quote }}
{{- end }}
