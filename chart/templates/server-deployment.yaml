apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trainingsapp.fullname" . }}-server
  labels:
    app.kubernetes.io/name: trainingsapp-server
    app.kubernetes.io/component: server
    {{- include "trainingsapp.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trainingsapp-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trainingsapp-server
        app.kubernetes.io/component: server
        {{- include "trainingsapp.commonLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: WEBAUTHN_RP_ID
              value: {{ include "trainingsapp.webauthnRpId" . | quote }}
            - name: WEBAUTHN_ORIGINS
              value: {{ include "trainingsapp.webauthnOrigins" . | quote }}
            - name: TRAININGSAPP_AUFRAEUMEN_CRON
              value: {{ .Values.server.aufraeumenCron | quote }}
            - name: TRAININGSAPP_BENUTZERNAME_SPERRLISTE
              value: {{ .Values.server.benutzernameSperrliste | quote }}
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "trainingsapp.secretName" . }}
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "trainingsapp.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "trainingsapp.secretName" . }}
                  key: DB_PASSWORD
            - name: SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "trainingsapp.secretName" . }}
                  key: SESSION_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
